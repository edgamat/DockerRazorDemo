name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - run: dotnet test
      - run: docker build --build-arg BUILD_VERSION=0.0.0.1 -t docker-razor-demo:ci .
